services:
  server:
    # Prebuilt image is pulled by default; `docker compose up -d --build`
    # builds from source instead (pull_policy only applies when not building).
    image: ghcr.io/ai-pocket-verse/agent-dashboard-server:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: server/Dockerfile
    # No published ports: only nginx (client) reaches the server via the
    # internal network. Exposing 3002 directly would bypass the reverse proxy.
    environment:
      # Required: without a secret the server only serves loopback requests,
      # so every request through nginx would be refused.
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:?Set DASHBOARD_SECRET (see README, Deploy with Docker)}
      - PROJECT_ROOT=${PROJECT_ROOT:?Set PROJECT_ROOT to the directory agents may work in}
      # Agents run as this user, so files they create belong to it on the host.
      # Set to your own `id -u` / `id -g` on Linux; macOS Docker Desktop maps ownership itself.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - CLAUDE_BIN=${CLAUDE_BIN:-claude}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_DIR=/app/data
      - MAX_RUN_MINUTES=${MAX_RUN_MINUTES:-30}
      - AI_SELECT_TIMEOUT_MS=${AI_SELECT_TIMEOUT_MS:-180000}
      - PORT=3001
      - NODE_ENV=production
    # tini as PID 1: forwards SIGTERM to the server and reaps exited agent processes
    init: true
    volumes:
      - ${PROJECT_ROOT}:${PROJECT_ROOT}
      - ./server/data:/app/data
    restart: unless-stopped

  client:
    image: ghcr.io/ai-pocket-verse/agent-dashboard-client:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
