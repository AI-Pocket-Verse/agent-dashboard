server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Upstreams are set through variables so nginx
    # re-resolves "server" after that container is recreated (new IP) instead
    # of returning 502 until nginx itself restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:3001;
    set $ws_upstream http://server:3002;

    location /api {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI 选型最长 AI_SELECT_TIMEOUT_MS（默认 180s），nginx 默认 60s 会提前断开
        proxy_read_timeout 200s;
    }

    location /ws {
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 服务端每 30s 发 ping 保活；读超时留足余量，避免 nginx 默认 60s 误断
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
